name: Python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install and test
        working-directory: python
        run: |
          uv sync
          uv run maturin develop --release
          uv run pytest -v -k "not symbolic"
