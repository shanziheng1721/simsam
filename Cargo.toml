[package]
name = "simsam"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.1"
simsym = { version = "0.1.0", optional = true }
rand_chacha = "0.10.0"

[features]
default = []
symbolic = ["dep:simsym"]

[dev-dependencies]
rand = { version = "0.10.1", features = ["std", "std_rng"] }
criterion = "0.8.2"

[[bench]]
name = "sampling"
harness = false

[[example]]
name = "triangle"
path = "examples/triangle.rs"

[[example]]
name = "symbolic"
path = "examples/symbolic.rs"
required-features = ["symbolic"]

[[example]]
name = "arbitrary_cdf"
